name: Release Pipeline

on:
  push:
    branches:
      - master
    paths-ignore:
      - README.md

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest


  release:
    name: Web + Android Release
    needs: test
    runs-on: ubuntu-latest

    outputs:
      android_released: ${{ steps.android_result.outputs.released }}
      android_tag: ${{ steps.android_result.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      # ============================================================
      # RELEASE WEB
      # Conserva vX.Y.Z-web y CHANGELOG.web.md
      # ============================================================
      - name: Release Web track
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:web


      # ============================================================
      # GUARDAR ÚLTIMA RELEASE ANDROID ANTES DEL RELEASE
      # ============================================================
      - name: Detectar tag Android anterior
        id: android_before
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE_TAG="$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName \
            --jq '[.[].tagName | select(endswith("-release-apk"))][0] // ""')"

          echo "tag=$BEFORE_TAG" >> "$GITHUB_OUTPUT"
          echo "Android anterior: $BEFORE_TAG"


      # ============================================================
      # RELEASE ANDROID
      # Conserva vX.Y.Z-release-apk y CHANGELOG.android.md
      # ============================================================
      - name: Release Android track
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:android


      # ============================================================
      # DETECTAR SI SEMANTIC-RELEASE CREÓ UNA RELEASE ANDROID NUEVA
      # ============================================================
      - name: Detectar nueva Release Android
        id: android_result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_TAG: ${{ steps.android_before.outputs.tag }}
        run: |
          AFTER_TAG="$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName \
            --jq '[.[].tagName | select(endswith("-release-apk"))][0] // ""')"

          echo "Android anterior: $BEFORE_TAG"
          echo "Android actual:   $AFTER_TAG"

          if [ -n "$AFTER_TAG" ] && [ "$AFTER_TAG" != "$BEFORE_TAG" ]; then
            echo "Nueva Release Android detectada."
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$AFTER_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "No se creó una nueva Release Android."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi


  # ==============================================================
  # DISCORD RELEASE / APK
  # Solo corre si realmente hubo una nueva release Android
  # ==============================================================
  discord-release:
    name: Discord APK Release
    needs: release
    if: needs.release.outputs.android_released == 'true'

    uses: ./.github/workflows/discord-release.yml

    with:
      release_tag: ${{ needs.release.outputs.android_tag }}

    secrets: inherit


  # ==============================================================
  # DISCORD CHANGELOG
  # ==============================================================
  discord-changelog:
    name: Discord Changelog
    needs: release
    if: needs.release.outputs.android_released == 'true'

    uses: ./.github/workflows/discord-changelog.yml

    with:
      release_tag: ${{ needs.release.outputs.android_tag }}

    secrets: inherit
