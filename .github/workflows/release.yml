name: Release Pipeline

# ==============================================================
# EJECUCIÓN MANUAL
#
# Ya NO corre automáticamente con cada push a master.
# Cuando quieras generar releases:
#
# GitHub -> Actions -> Release Pipeline -> Run workflow
#
# Esto evita ejecuciones innecesarias y correos de error
# por cada commit.
# ==============================================================
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write


jobs:

  # ============================================================
  # TESTS
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest


  # ============================================================
  # RELEASES
  #
  # IMPORTANTE:
  # La Web y Android siguen siendo tracks independientes.
  #
  # WEB:
  #   .releaserc.web.json
  #   vX.Y.Z-web
  #   CHANGELOG.web.md
  #
  # ANDROID AUTOMÁTICO:
  #   .releaserc.android.json
  #   vX.Y.Z-release-apk
  #   CHANGELOG.android.md
  #
  # Tus releases manuales:
  #   OFICIAL-vA.B.C.D-release-apk
  #   BETA-ABIERTA-vA.B.C.D-release-apk
  #   ALPHA-vA.B.C.D-release-apk
  #
  # son gestionadas directamente por los workflows de Discord.
  # ============================================================
  release:
    name: Web + Android Release
    needs: test
    runs-on: ubuntu-latest

    outputs:
      android_released: ${{ steps.android_result.outputs.released }}
      android_tag: ${{ steps.android_result.outputs.tag }}

    steps:

      # ========================================================
      # CHECKOUT COMPLETO
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # NODE
      # ========================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # ========================================================
      # DEPENDENCIAS
      # ========================================================
      - name: Install dependencies
        run: npm ci


      # ========================================================
      # RELEASE WEB
      #
      # NO SE MODIFICA SU FORMATO.
      #
      # Sigue usando:
      # vX.Y.Z-web
      #
      # y:
      # CHANGELOG.web.md
      # ========================================================
      - name: Release Web track
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:web


      # ========================================================
      # DETECTAR LA ÚLTIMA RELEASE ANDROID EXISTENTE
      #
      # Solo usamos tags terminados en:
      # -release-apk
      #
      # Esto NO toca ni detecta:
      # -web
      # ========================================================
      - name: Detectar tag Android anterior
        id: android_before
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          BEFORE_TAG="$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName \
            --jq '[.[].tagName | select(endswith("-release-apk"))][0] // ""')"

          echo "tag=$BEFORE_TAG" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Última Release Android antes del proceso:"
          echo "$BEFORE_TAG"
          echo "=========================================="


      # ========================================================
      # RELEASE ANDROID AUTOMÁTICO
      #
      # Mantiene exactamente el sistema actual:
      #
      # npm run release:android
      #
      # No modificamos semantic-release aquí.
      # ========================================================
      - name: Release Android track
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:android


      # ========================================================
      # DETECTAR SI ANDROID CREÓ UNA RELEASE NUEVA
      #
      # Comparamos la última Release Android antes y después
      # de ejecutar semantic-release.
      #
      # Web queda fuera porque solo aceptamos:
      # *-release-apk
      # ========================================================
      - name: Detectar nueva Release Android
        id: android_result
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_TAG: ${{ steps.android_before.outputs.tag }}

        run: |
          AFTER_TAG="$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName \
            --jq '[.[].tagName | select(endswith("-release-apk"))][0] // ""')"

          echo "=========================================="
          echo "Android anterior: $BEFORE_TAG"
          echo "Android actual:   $AFTER_TAG"
          echo "=========================================="

          if [ -n "$AFTER_TAG" ] && [ "$AFTER_TAG" != "$BEFORE_TAG" ]; then

            echo "Nueva Release Android detectada."

            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$AFTER_TAG" >> "$GITHUB_OUTPUT"

          else

            echo "No se creó una nueva Release Android."

            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"

          fi


  # ==============================================================
  # DISCORD RELEASE / APK
  #
  # Este job SOLO se ejecuta cuando el Release Pipeline
  # realmente crea una nueva Release Android.
  #
  # Publica:
  # @everyone
  # versión
  # APK
  # enlace de GitHub
  #
  # NO publica changelog.
  # ==============================================================
  discord-release:
    name: Discord APK Release
    needs: release

    if: needs.release.outputs.android_released == 'true'

    uses: ./.github/workflows/discord-release.yml

    with:
      release_tag: ${{ needs.release.outputs.android_tag }}

    secrets: inherit


  # ==============================================================
  # DISCORD CHANGELOG
  #
  # También se ejecuta únicamente cuando aparece
  # una nueva Release Android.
  #
  # Publica solamente:
  # changelog / release notes
  #
  # SIN @everyone
  # SIN duplicar el APK.
  # ==============================================================
  discord-changelog:
    name: Discord Changelog
    needs: release

    if: needs.release.outputs.android_released == 'true'

    uses: ./.github/workflows/discord-changelog.yml

    with:
      release_tag: ${{ needs.release.outputs.android_tag }}

    secrets: inherit
