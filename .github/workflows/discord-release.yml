name: Discord Release Feed

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag Android que debe publicarse"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag Android existente para probar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify-discord:
    name: Publicar Release Android en Discord
    runs-on: ubuntu-latest

    steps:
      - name: Obtener Release Android
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}

        run: |
          echo "Buscando Release: $RELEASE_TAG"

          RELEASE_JSON="$(gh api \
            "repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"

          RELEASE_NAME="$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name')"
          RELEASE_URL="$(echo "$RELEASE_JSON" | jq -r '.html_url')"
          RELEASE_BODY="$(echo "$RELEASE_JSON" | jq -r '.body // ""')"
          IS_PRERELEASE="$(echo "$RELEASE_JSON" | jq -r '.prerelease')"

          APK_URL="$(echo "$RELEASE_JSON" | jq -r \
            '[.assets[] | select(.name | ascii_downcase | endswith(".apk"))][0].browser_download_url // ""')"

          APK_NAME="$(echo "$RELEASE_JSON" | jq -r \
            '[.assets[] | select(.name | ascii_downcase | endswith(".apk"))][0].name // ""')"

          {
            echo "release_name=$RELEASE_NAME"
            echo "release_url=$RELEASE_URL"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "apk_url=$APK_URL"
            echo "apk_name=$APK_NAME"

            echo "release_body<<EOF"
            echo "$RELEASE_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Release encontrada: $RELEASE_NAME"

          if [ -n "$APK_URL" ]; then
            echo "APK encontrado: $APK_NAME"
          else
            echo "AVISO: esta Release no tiene un .apk adjunto."
          fi


      - name: Publicar en Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          RELEASE_BODY: ${{ steps.release.outputs.release_body }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}

          APK_URL: ${{ steps.release.outputs.apk_url }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}

        run: |
          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = os.environ.get("WEBHOOK_URL", "").strip()

          if not webhook:
              raise RuntimeError(
                  "Falta el secret DISCORD_RELEASE_WEBHOOK."
              )

          tag = os.environ["RELEASE_TAG"].strip()
          name = os.environ.get("RELEASE_NAME", "").strip() or f"FridaMusic {tag}"
          release_url = os.environ["RELEASE_URL"].strip()
          body = os.environ.get("RELEASE_BODY", "").strip()

          apk_url = os.environ.get("APK_URL", "").strip()
          apk_name = os.environ.get("APK_NAME", "").strip()

          prerelease = (
              os.environ.get("IS_PRERELEASE", "false").lower()
              == "true"
          )

          status = (
              "🧪 BETA / PRE-RELEASE"
              if prerelease
              else "✅ OFFICIAL ANDROID RELEASE"
          )

          if not body:
              body = "Nueva versión de FridaMusic disponible."

          # Discord embed description max = 4096
          if len(body) > 2600:
              body = body[:2597] + "..."

          description = f"""
          {status}

          🎧 **FridaMusic**
          📱 **Android APK**
          🏷️ **Versión:** `{tag}`

          ### 📋 Release Notes
          {body}
          """.strip()

          if apk_url:
              description += (
                  f"\n\n📦 **[{apk_name}]({apk_url})**"
              )
          else:
              description += (
                  "\n\n⚠️ **No se encontró un APK adjunto a esta Release.**"
              )

          description += (
              f"\n\n🔗 **[Ver Release completa en GitHub]({release_url})**"
          )

          payload = {
              "username": "Frida Labs • Releases",

              "content": "@everyone",

              "allowed_mentions": {
                  "parse": ["everyone"]
              },

              "embeds": [
                  {
                      "title": f"🚀 {name}",
                      "description": description,
                      "url": release_url,
                      "color": 11829780,
                      "footer": {
                          "text": "FridaMusic • Android • Frida Labs"
                      }
                  }
              ]
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "FridaMusic-Release-Bot"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:
                  print(
                      f"Discord Release OK - HTTP {response.status}"
                  )

          except urllib.error.HTTPError as error:
              message = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  f"Discord HTTP ERROR {error.code}: {message}"
              )

              raise

          PY
