name: Discord Release Feed

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      test_version:
        description: "Versión de prueba"
        required: false
        default: "vTEST"

      test_type:
        description: "Tipo de prueba"
        required: false
        default: "TEST"

permissions:
  contents: read

jobs:
  notify-discord:
    name: Publicar Release en Discord
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # OBTENER APK DE LA RELEASE
      # ============================================================
      - name: Obtener datos de la Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          REPOSITORY: ${{ github.repository }}

        run: |
          APK_URL=""
          APK_NAME=""

          if [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_ID" ]; then

            echo "Buscando APK en la Release $RELEASE_ID..."

            APK_URL=$(gh api \
              "repos/$REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq '.[] | select(.name | endswith(".apk")) | .browser_download_url' \
              | head -n 1)

            APK_NAME=$(gh api \
              "repos/$REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq '.[] | select(.name | endswith(".apk")) | .name' \
              | head -n 1)

          else
            echo "Ejecución manual detectada."
            echo "No se buscará APK."
          fi

          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

          if [ -n "$APK_URL" ]; then
            echo "APK encontrado: $APK_NAME"
          else
            echo "No se encontró APK o es una prueba manual."
          fi


      # ============================================================
      # PUBLICAR EN DISCORD
      # ============================================================
      - name: Publicar en Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

          EVENT_NAME: ${{ github.event_name }}

          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}

          TEST_VERSION: ${{ inputs.test_version }}
          TEST_TYPE: ${{ inputs.test_type }}

          APK_URL: ${{ steps.release.outputs.apk_url }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}

          REPOSITORY: ${{ github.repository }}

        run: |
          python <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error


          # ========================================================
          # CONFIGURACIÓN
          # ========================================================

          webhook = os.environ.get("WEBHOOK_URL", "").strip()

          if not webhook:
              raise RuntimeError(
                  "No se encontró el secret DISCORD_RELEASE_WEBHOOK."
              )

          event = os.environ.get("EVENT_NAME", "").strip()
          repository = os.environ.get("REPOSITORY", "").strip()


          # ========================================================
          # RELEASE REAL
          # ========================================================

          if event == "release":

              tag = os.environ.get("RELEASE_TAG", "").strip()

              name = (
                  os.environ.get("RELEASE_NAME", "").strip()
                  or f"FridaMusic {tag}"
              )

              body = os.environ.get("RELEASE_BODY", "").strip()

              release_url = os.environ.get(
                  "RELEASE_URL",
                  f"https://github.com/{repository}/releases"
              ).strip()

              prerelease = (
                  os.environ.get("IS_PRERELEASE", "false").lower()
                  == "true"
              )

              apk_url = os.environ.get("APK_URL", "").strip()
              apk_name = os.environ.get("APK_NAME", "").strip()

              if prerelease:
                  status = "🧪 BETA / PRE-RELEASE"
              else:
                  status = "✅ STABLE RELEASE"

              if not body:
                  body = "Sin notas adicionales para esta versión."


          # ========================================================
          # PRUEBA MANUAL
          # ========================================================

          else:

              tag = (
                  os.environ.get("TEST_VERSION", "").strip()
                  or "vTEST"
              )

              test_type = (
                  os.environ.get("TEST_TYPE", "").strip()
                  or "TEST"
              )

              name = f"FridaMusic {tag}"

              status = "🧪 TEST MANUAL"

              body = f"""
          Esta es una prueba manual del sistema automático de Releases.

          ✅ GitHub Actions funcionando
          ✅ Webhook de Discord funcionando
          ✅ Comunicación GitHub → Discord funcionando

          Tipo: {test_type}
          """.strip()

              release_url = (
                  f"https://github.com/{repository}/releases"
              )

              apk_url = ""
              apk_name = ""


          # ========================================================
          # LÍMITES DE DISCORD
          # ========================================================

          if len(body) > 3000:
              body = body[:2997] + "..."

          if len(name) > 220:
              name = name[:217] + "..."


          # ========================================================
          # MENSAJE
          # ========================================================

          description = f"""
          {status}

          🎧 **FridaMusic**
          🏷️ **Versión:** `{tag}`

          ### 📋 Cambios
          {body}
          """.strip()


          # ========================================================
          # APK
          # ========================================================

          if apk_url and apk_name:

              description += (
                  f"\n\n"
                  f"📦 **[Descargar {apk_name}]({apk_url})**"
              )

          elif event == "release":

              description += (
                  "\n\n"
                  "📦 APK no adjunto en esta Release."
              )


          # ========================================================
          # GITHUB
          # ========================================================

          description += (
              f"\n\n"
              f"🔗 **[Ver Release completa en GitHub]({release_url})**"
          )


          # ========================================================
          # PAYLOAD DISCORD
          # ========================================================

          payload = {
              "username": "Frida Labs • Releases",

              "content": "@everyone",

              "allowed_mentions": {
                  "parse": ["everyone"]
              },

              "embeds": [
                  {
                      "title": f"🚀 {name}",

                      "description": description,

                      "url": release_url,

                      "color": 11829780,

                      "footer": {
                          "text": "FridaMusic • by Frida Labs"
                      }
                  }
              ]
          }


          # ========================================================
          # ENVIAR WEBHOOK
          # ========================================================

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")


          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "FridaMusic-Release-Bot"
              },
              method="POST"
          )


          try:

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  print(
                      f"Discord webhook OK - HTTP {response.status}"
                  )


          except urllib.error.HTTPError as error:

              error_body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  f"Discord HTTP ERROR {error.code}"
              )

              print(error_body)

              raise


          except Exception as error:

              print(
                  f"ERROR enviando la Release a Discord: {error}"
              )

              raise

          PY
