name: Discord Release Feed

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag Android que debe publicarse"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag Android existente para probar"
        required: true
        type: string

  release:
    types:
      - published

permissions:
  contents: read

jobs:
  notify-discord:
    name: Publicar Release Android en Discord
    runs-on: ubuntu-latest

    # ============================================================
    # SOLO ANDROID
    #
    # Acepta:
    # OFICIAL-vA.B.C.D-release-apk
    # BETA-ABIERTA-vA.B.C.D-release-apk
    # ALPHA-vA.B.C.D-release-apk
    #
    # También permite workflow_call / workflow_dispatch.
    #
    # Las releases web vX.Y.Z-web NO entran aquí.
    # ============================================================
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'release' &&
        endsWith(github.event.release.tag_name, '-release-apk') &&
        (
          startsWith(github.event.release.tag_name, 'OFICIAL-v') ||
          startsWith(github.event.release.tag_name, 'BETA-ABIERTA-v') ||
          startsWith(github.event.release.tag_name, 'ALPHA-v')
        )
      )

    steps:
      - name: Resolver tag Android
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}

        run: |
          if [ -n "$INPUT_TAG" ]; then
            RELEASE_TAG="$INPUT_TAG"
          else
            RELEASE_TAG="$EVENT_TAG"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "ERROR: No se pudo resolver el tag."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Tag Android: $RELEASE_TAG"

      - name: Validar tag Android
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}

        run: |
          if [[ "$RELEASE_TAG" =~ ^(OFICIAL|BETA-ABIERTA|ALPHA)-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-release-apk$ ]]; then
            echo "Tag FridaMusic Android válido: $RELEASE_TAG"
            exit 0
          fi

          # Compatibilidad con tags antiguos de semantic-release.
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-release-apk$ ]]; then
            echo "Tag Android legacy válido: $RELEASE_TAG"
            exit 0
          fi

          echo "ERROR: Tag Android no reconocido:"
          echo "$RELEASE_TAG"
          exit 1

      - name: Obtener Release Android
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}

        run: |
          echo "Buscando Release: $RELEASE_TAG"

          RELEASE_JSON="$(gh api \
            "repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"

          RELEASE_NAME="$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name')"
          RELEASE_URL="$(echo "$RELEASE_JSON" | jq -r '.html_url')"
          IS_PRERELEASE="$(echo "$RELEASE_JSON" | jq -r '.prerelease')"

          APK_URL="$(echo "$RELEASE_JSON" | jq -r \
            '[.assets[] | select(.name | ascii_downcase | endswith(".apk"))][0].browser_download_url // ""')"

          APK_NAME="$(echo "$RELEASE_JSON" | jq -r \
            '[.assets[] | select(.name | ascii_downcase | endswith(".apk"))][0].name // ""')"

          {
            echo "release_name=$RELEASE_NAME"
            echo "release_url=$RELEASE_URL"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "apk_url=$APK_URL"
            echo "apk_name=$APK_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Release encontrada: $RELEASE_NAME"

          if [ -n "$APK_URL" ]; then
            echo "APK encontrado: $APK_NAME"
          else
            echo "AVISO: esta Release no tiene APK adjunto."
          fi

      - name: Publicar en Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}

          APK_URL: ${{ steps.release.outputs.apk_url }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}

        run: |
          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = os.environ.get("WEBHOOK_URL", "").strip()

          if not webhook:
              raise RuntimeError(
                  "Falta el secret DISCORD_RELEASE_WEBHOOK."
              )

          tag = os.environ["RELEASE_TAG"].strip()

          name = (
              os.environ.get("RELEASE_NAME", "").strip()
              or f"FridaMusic {tag}"
          )

          release_url = os.environ["RELEASE_URL"].strip()

          apk_url = os.environ.get("APK_URL", "").strip()
          apk_name = os.environ.get("APK_NAME", "").strip()

          prerelease = (
              os.environ.get("IS_PRERELEASE", "false").lower()
              == "true"
          )

          # ========================================================
          # TIPO DE RELEASE SEGÚN TAG
          # ========================================================

          if tag.startswith("OFICIAL-"):
              status = "✅ OFICIAL"
              stage = "Producción"

          elif tag.startswith("BETA-ABIERTA-"):
              status = "🧪 BETA ABIERTA"
              stage = "Release Candidate"

          elif tag.startswith("ALPHA-"):
              status = "🧰 ALPHA"
              stage = "Pruebas internas"

          elif prerelease:
              status = "🧪 PRE-RELEASE"
              stage = "Pruebas"

          else:
              status = "✅ ANDROID RELEASE"
              stage = "Android"

          description = f"""
          {status}

          🎧 **FridaMusic**
          📱 **Android APK**
          🏷️ **Versión:** `{tag}`
          🚦 **Canal:** {stage}

          🚀 Nueva versión de FridaMusic disponible.
          """.strip()

          if apk_url and apk_name:
              description += (
                  f"\n\n"
                  f"📦 **[Descargar {apk_name}]({apk_url})**"
              )
          else:
              description += (
                  "\n\n"
                  "⚠️ **No se encontró un APK adjunto a esta Release.**"
              )

          description += (
              f"\n\n"
              f"🔗 **[Ver Release en GitHub]({release_url})**"
          )

          payload = {
              "username": "Frida Labs • Releases",

              "content": "@everyone",

              "allowed_mentions": {
                  "parse": ["everyone"]
              },

              "embeds": [
                  {
                      "title": f"🚀 {name}",
                      "description": description,
                      "url": release_url,
                      "color": 11829780,
                      "footer": {
                          "text": "FridaMusic • Android • Frida Labs"
                      }
                  }
              ]
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "FridaMusic-Release-Bot"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  print(
                      f"Discord Release OK - HTTP {response.status}"
                  )

          except urllib.error.HTTPError as error:

              message = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  f"Discord HTTP ERROR {error.code}: {message}"
              )

              raise

          PY
