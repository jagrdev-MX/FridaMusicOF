name: Discord Release Feed

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      test_version:
        description: "Versión de prueba"
        required: false
        default: "vTEST"
      test_type:
        description: "Tipo de prueba"
        required: false
        default: "TEST"

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener datos de la Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            APK_URL=$(gh api \
              repos/$REPOSITORY/releases/$RELEASE_ID/assets \
              --jq '.[] | select(.name | endswith(".apk")) | .browser_download_url' \
              | head -n 1)

            APK_NAME=$(gh api \
              repos/$REPOSITORY/releases/$RELEASE_ID/assets \
              --jq '.[] | select(.name | endswith(".apk")) | .name' \
              | head -n 1)
          else
            APK_URL=""
            APK_NAME=""
          fi

          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar en Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

          EVENT_NAME: ${{ github.event_name }}

          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}

          TEST_VERSION: ${{ inputs.test_version }}
          TEST_TYPE: ${{ inputs.test_type }}

          APK_URL: ${{ steps.release.outputs.apk_url }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}

          REPOSITORY: ${{ github.repository }}

        run: |
          python <<'PY'
          import os
          import json
          import urllib.request

          webhook = os.environ["WEBHOOK_URL"]

          event = os.environ.get("EVENT_NAME", "")

          # =========================
          # RELEASE REAL
          # =========================
          if event == "release":
              tag = os.environ.get("RELEASE_TAG", "")
              name = os.environ.get("RELEASE_NAME") or f"FridaMusic {tag}"
              body = os.environ.get("RELEASE_BODY", "").strip()
              release_url = os.environ.get("RELEASE_URL", "")
              prerelease = os.environ.get("IS_PRERELEASE", "false").lower() == "true"

              apk_url = os.environ.get("APK_URL", "").strip()
              apk_name = os.environ.get("APK_NAME", "").strip()

              status = "🧪 BETA / PRE-RELEASE" if prerelease else "✅ STABLE RELEASE"

              if not body:
                  body = "Sin notas adicionales para esta versión."

          # =========================
          # PRUEBA MANUAL
          # =========================
          else:
              tag = os.environ.get("TEST_VERSION", "vTEST")
              test_type = os.environ.get("TEST_TYPE", "TEST")

              name = f"FridaMusic {tag}"
              status = "🧪 TEST MANUAL"

              body = f"""
              Esta es una prueba manual del sistema automático de Releases.

              ✅ GitHub Actions funcionando
              ✅ Webhook de Discord funcionando
              ✅ Comunicación GitHub → Discord funcionando

              Tipo: {test_type}
              """.strip()

              repository = os.environ.get("REPOSITORY", "")
              release_url = f"https://github.com/{repository}/releases"

              apk_url = ""
              apk_name = ""

          # Discord tiene límites de longitud
          if len(body) > 3000:
              body = body[:2997] + "..."

          description = f"""
          {status}

          🎧 **FridaMusic**
          🏷️ **Versión:** `{tag}`

          ### 📋 Cambios
          {body}
          """.strip()

          if apk_url:
              description += f"\n\n📦 **[{apk_name}]({apk_url})**"

          description += f"\n\n🔗 **[Ver en GitHub]({release_url})**"

          payload = {
              "username": "Frida Labs • Releases",
              "embeds": [
                  {
                      "title": f"🚀 {name}",
                      "description": description,
                      "url": release_url,
                      "color": 11829780,
                      "footer": {
                          "text": "FridaMusic • by Frida Labs"
                      }
                  }
              ]
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "FridaMusic-Release-Bot"
              }
          )

          try:
              with urllib.request.urlopen(req) as response:
                  print(f"Discord webhook OK: HTTP {response.status}")
          except Exception as e:
              print(f"ERROR enviando a Discord: {e}")
              raise

          PY
