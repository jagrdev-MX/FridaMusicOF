name: Telegram Release Feed

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag de la Release que debe publicarse"
        required: true
        type: string
      product_name:
        description: "Nombre visible del producto"
        required: false
        type: string
        default: "FridaMusic"
      test_mode:
        description: "Marca el mensaje como prueba"
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de una Release existente para probar"
        required: true
        type: string
      product_name:
        description: "Nombre visible del producto"
        required: false
        default: "FridaMusic"
        type: string
      test_mode:
        description: "Enviar como mensaje de prueba"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  notify-telegram:
    name: Publicar Release en Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Resolver configuración
        id: config
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRODUCT_NAME: ${{ inputs.product_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "ERROR: No se recibió release_tag."
            exit 1
          fi
          if [ -z "$PRODUCT_NAME" ]; then
            PRODUCT_NAME="${GITHUB_REPOSITORY#*/}"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "product_name=$PRODUCT_NAME" >> "$GITHUB_OUTPUT"

      - name: Obtener Release y assets
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.config.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RELEASE_JSON="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"

          RELEASE_NAME="$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name')"
          RELEASE_URL="$(echo "$RELEASE_JSON" | jq -r '.html_url')"
          IS_PRERELEASE="$(echo "$RELEASE_JSON" | jq -r '.prerelease')"
          RELEASE_BODY="$(echo "$RELEASE_JSON" | jq -r '.body // ""')"

          APK_URL="$(echo "$RELEASE_JSON" | jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".apk"))][0].browser_download_url // ""')"
          APK_NAME="$(echo "$RELEASE_JSON" | jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".apk"))][0].name // ""')"

          # Primero: imagen adjunta como asset de la Release.
          IMAGE_URL="$(echo "$RELEASE_JSON" | jq -r '[.assets[] | select(.name | ascii_downcase | test("\\.(png|jpg|jpeg|webp)$"))][0].browser_download_url // ""')"

          # Segundo: primera URL de imagen incluida en el body de la Release.
          if [ -z "$IMAGE_URL" ]; then
            IMAGE_URL="$(printf '%s' "$RELEASE_BODY" | grep -Eo 'https?://[^ )>"'"']+\.(png|jpg|jpeg|webp)(\?[^ )>"'"']*)?' | head -n 1 || true)"
          fi

          {
            echo "release_name=$RELEASE_NAME"
            echo "release_url=$RELEASE_URL"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "apk_url=$APK_URL"
            echo "apk_name=$APK_NAME"
            echo "image_url=$IMAGE_URL"
          } >> "$GITHUB_OUTPUT"

          echo "Release encontrada: $RELEASE_NAME"
          [ -n "$APK_URL" ] && echo "APK encontrado: $APK_NAME" || echo "AVISO: no hay APK adjunto."
          [ -n "$IMAGE_URL" ] && echo "Artwork encontrado: $IMAGE_URL" || echo "INFO: no se encontró artwork; se usará mensaje de texto."

      - name: Validar secrets de Telegram
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_APK_THREAD_ID }}
        run: |
          test -n "$BOT_TOKEN" || { echo "ERROR: falta TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$CHAT_ID" || { echo "ERROR: falta TELEGRAM_CHAT_ID"; exit 1; }
          test -n "$THREAD_ID" || { echo "ERROR: falta TELEGRAM_APK_THREAD_ID"; exit 1; }
          echo "Secrets requeridos presentes."

      - name: Publicar en Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_APK_THREAD_ID }}
          RELEASE_TAG: ${{ steps.config.outputs.tag }}
          PRODUCT_NAME: ${{ steps.config.outputs.product_name }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
          APK_URL: ${{ steps.release.outputs.apk_url }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          IMAGE_URL: ${{ steps.release.outputs.image_url }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: |
          python <<'PY'
          import html
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["BOT_TOKEN"].strip()
          chat_id = os.environ["CHAT_ID"].strip()
          thread_id = int(os.environ["THREAD_ID"].strip())
          tag = os.environ["RELEASE_TAG"].strip()
          product = os.environ.get("PRODUCT_NAME", "").strip() or "Release"
          release_url = os.environ["RELEASE_URL"].strip()
          apk_url = os.environ.get("APK_URL", "").strip()
          apk_name = os.environ.get("APK_NAME", "").strip()
          image_url = os.environ.get("IMAGE_URL", "").strip()
          prerelease = os.environ.get("IS_PRERELEASE", "false").lower() == "true"
          test_mode = os.environ.get("TEST_MODE", "false").lower() == "true"
          api_base = f"https://api.telegram.org/bot{token}"

          def telegram_call(method, payload, tolerate=()):
              data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  f"{api_base}/{method}",
                  data=data,
                  headers={"Content-Type": "application/json", "User-Agent": f"{product}-Telegram-Release-Bot"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      result = json.loads(body)
                      if not result.get("ok"):
                          raise RuntimeError(body)
                      return result
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  if any(code.lower() in body.lower() for code in tolerate):
                      print(f"Telegram {method}: estado ya compatible -> {body}")
                      return None
                  print(f"Telegram HTTP ERROR {error.code} en {method}: {body}")
                  raise

          if tag.startswith("OFICIAL-"):
              status, stage = "✅ OFICIAL", "Producción"
          elif tag.startswith("BETA-ABIERTA-"):
              status, stage = "🧪 BETA ABIERTA", "Release Candidate"
          elif tag.startswith("ALPHA-"):
              status, stage = "🧰 ALPHA", "Pruebas internas"
          elif prerelease:
              status, stage = "🧪 PRE-RELEASE", "Pruebas"
          else:
              status, stage = "✅ ANDROID RELEASE", "Android"

          prefix = "🧪 <b>PRUEBA DE INTEGRACIÓN</b>\n\n" if test_mode else ""
          text = (
              prefix
              + f"🚀 <b>{html.escape(product)}</b>\n\n"
              + f"{status}\n"
              + "📱 <b>Android APK</b>\n"
              + f"🏷️ <b>Versión:</b> <code>{html.escape(tag)}</code>\n"
              + f"🚦 <b>Canal:</b> {html.escape(stage)}\n\n"
              + f"🚀 Nueva versión de {html.escape(product)} disponible."
          )

          if apk_url and apk_name:
              text += f"\n\n📦 <a href=\"{html.escape(apk_url, quote=True)}\">Descargar {html.escape(apk_name)}</a>"
          else:
              text += "\n\n⚠️ <b>No se encontró un APK adjunto.</b>"
          text += f"\n🔗 <a href=\"{html.escape(release_url, quote=True)}\">Ver Release en GitHub</a>"

          buttons = []
          if apk_url:
              buttons.append({"text": "📥 Descargar APK", "url": apk_url})
          buttons.append({"text": "🔗 Ver Release", "url": release_url})

          topic = {"chat_id": chat_id, "message_thread_id": thread_id}
          common = {
              **topic,
              "parse_mode": "HTML",
              "reply_markup": {"inline_keyboard": [buttons]},
          }

          # Funciona tanto si el topic empieza abierto como cerrado.
          # Si ya está abierto, Telegram puede responder "not modified" y se continúa.
          try:
              telegram_call("reopenForumTopic", topic, tolerate=("not modified", "topic_not_modified"))
              print("Topic listo para publicación.")

              if image_url:
                  telegram_call("sendPhoto", {**common, "photo": image_url, "caption": text})
                  print("Telegram Release OK - sendPhoto")
              else:
                  telegram_call("sendMessage", {**common, "text": text, "link_preview_options": {"is_disabled": True}})
                  print("Telegram Release OK - sendMessage (sin artwork detectable)")
          finally:
              try:
                  telegram_call("closeForumTopic", topic, tolerate=("not modified", "topic_not_modified"))
                  print("Topic cerrado nuevamente.")
              except Exception as close_error:
                  print(f"ADVERTENCIA: no se pudo cerrar el topic: {close_error}")
          PY
