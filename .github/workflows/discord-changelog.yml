name: Discord Changelog Feed

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      test_version:
        description: "Versión de prueba"
        required: false
        default: "vTEST"

permissions:
  contents: read

jobs:
  publish-changelog:
    name: Publicar Changelog en Discord
    runs-on: ubuntu-latest

    steps:
      - name: Publicar changelog en Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}

          EVENT_NAME: ${{ github.event_name }}

          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}

          TEST_VERSION: ${{ inputs.test_version }}

          REPOSITORY: ${{ github.repository }}

        run: |
          python <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error


          webhook = os.environ.get("WEBHOOK_URL", "").strip()

          if not webhook:
              raise RuntimeError(
                  "No se encontró el secret DISCORD_CHANGELOG_WEBHOOK."
              )

          event = os.environ.get("EVENT_NAME", "").strip()
          repository = os.environ.get("REPOSITORY", "").strip()


          # ========================================================
          # RELEASE REAL
          # ========================================================

          if event == "release":

              tag = os.environ.get("RELEASE_TAG", "").strip()

              name = (
                  os.environ.get("RELEASE_NAME", "").strip()
                  or f"FridaMusic {tag}"
              )

              body = os.environ.get("RELEASE_BODY", "").strip()

              release_url = os.environ.get(
                  "RELEASE_URL",
                  f"https://github.com/{repository}/releases"
              ).strip()

              prerelease = (
                  os.environ.get("IS_PRERELEASE", "false").lower()
                  == "true"
              )

              status = (
                  "🧪 BETA / PRE-RELEASE"
                  if prerelease
                  else "✅ STABLE RELEASE"
              )

              if not body:
                  body = "No se especificaron cambios para esta versión."


          # ========================================================
          # PRUEBA MANUAL
          # ========================================================

          else:

              tag = (
                  os.environ.get("TEST_VERSION", "").strip()
                  or "vTEST"
              )

              name = f"FridaMusic {tag}"

              status = "🧪 CHANGELOG TEST"

              body = """
          ✨ Features
          • Nueva función de ejemplo.

          🛠 Improvements
          • Mejora de rendimiento de ejemplo.

          🐛 Fixes
          • Corrección de ejemplo.

          ⚙️ Tech
          • Cambio técnico de ejemplo.
          """.strip()

              release_url = (
                  f"https://github.com/{repository}/releases"
              )


          # ========================================================
          # LÍMITES DE DISCORD
          # ========================================================

          if len(body) > 3500:
              body = body[:3497] + "..."

          if len(name) > 220:
              name = name[:217] + "..."


          # ========================================================
          # MENSAJE
          # ========================================================

          description = f"""
          {status}

          🎧 **FridaMusic**
          🏷️ **Versión:** `{tag}`

          ## 📜 Changelog

          {body}

          🔗 **[Ver Release completa en GitHub]({release_url})**
          """.strip()


          payload = {
              "username": "Frida Labs • Changelog",

              "embeds": [
                  {
                      "title": f"📜 {name}",

                      "description": description,

                      "url": release_url,

                      "color": 11829780,

                      "footer": {
                          "text": "FridaMusic • Changelog • Frida Labs"
                      }
                  }
              ]
          }


          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")


          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "FridaMusic-Changelog-Bot"
              },
              method="POST"
          )


          try:

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  print(
                      f"Discord changelog OK - HTTP {response.status}"
                  )


          except urllib.error.HTTPError as error:

              error_body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  f"Discord HTTP ERROR {error.code}"
              )

              print(error_body)

              raise


          except Exception as error:

              print(
                  f"ERROR enviando changelog a Discord: {error}"
              )

              raise

          PY
